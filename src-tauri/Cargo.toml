[package]
name = "fish-reader"
version = "0.2.2"
description = "Personal ElevenReader-style book reader powered by Fish Audio TTS"
authors = ["Mornify"]
edition = "2021"

[lib]
name = "fish_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
